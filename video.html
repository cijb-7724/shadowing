<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadowing</title>
  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="./assets/video.css">
</head>
<body>
  <header class="lesson-header wrap">
    <a class="back-link" href="./">← Library</a>
    <p class="eyebrow">SHADOWING LESSON</p>
    <h1 id="title">読み込み中…</h1>
    <p class="lead">時刻をタップすると、その文の少し前から再生します。日本語訳は必要なときだけ開けます。</p>
  </header>
  <main class="lesson-layout wrap">
    <aside class="player-column">
      <div class="video-container"><div id="youtube-player"></div></div>
      <div class="progress-card">
        <span id="sentence-count">0 sentences</span>
        <button id="collapse-all" type="button">訳をすべて隠す</button>
      </div>
    </aside>
    <section id="sentences" class="sentence-list" aria-live="polite"></section>
  </main>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="./assets/video.js" defer></script>
</body>
</html>
